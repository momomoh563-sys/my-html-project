<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>WALID PHONE</title>
<style>
*{box-sizing:border-box}
:root{--blue:#1877e8;--green:#23a653;--orange:#f4a51c;--purple:#814be8;--cyan:#19a7b7;--red:#ef5360;--line:#d7dee9;--text:#172033}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;background:#eef2f7;color:var(--text)}
body{direction:rtl}.app{width:100%;min-height:100vh;background:#fff}
.header{height:76px;background:linear-gradient(90deg,#0878ee,#2383e8);color:#fff;padding:0 28px;display:flex;align-items:center}
.header-row{width:100%;display:flex;align-items:center;justify-content:space-between;gap:18px}
.brand-wrap{display:flex;align-items:center;gap:13px}.logo{width:42px;height:42px;border-radius:10px;background:#fff;color:#1677e8;display:grid;place-items:center;font-size:23px;font-weight:900}
.brand{font-size:26px;font-weight:800}.sub{font-size:13px;opacity:.9;margin-top:2px}
.header-tools{display:flex;align-items:center;gap:14px}.clock{font-size:16px;font-weight:700;text-align:center;line-height:1.2}
.header-btn{border:0;background:transparent;color:#fff;font-size:15px;padding:10px 12px}.header-btn span{font-size:21px;margin-left:6px}
.content{padding:16px 28px 24px;background:#fff}.menu-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;margin-bottom:16px}
.card{border-radius:10px;padding:16px 12px;min-height:92px;color:#fff;box-shadow:0 2px 5px #00000012;cursor:pointer;text-align:center}
.card .ico{font-size:31px;line-height:1;margin-bottom:9px}.card h3{margin:0;font-size:18px;font-weight:800}.card p{display:none}
.card:nth-child(1){background:var(--blue)}.card:nth-child(2){background:var(--green)}.card:nth-child(3){background:var(--orange)}.card:nth-child(4){background:var(--purple)}.card:nth-child(5){background:var(--cyan)}.card:nth-child(6){background:var(--red)}
.search-row{display:grid;grid-template-columns:1.7fr 1fr 1fr 170px;gap:10px;margin-bottom:12px}
.search-row input{height:45px;border:1px solid var(--line);border-radius:7px;padding:0 13px;background:#fff;color:#334155;font-size:14px;outline:none}
.search-wrap{position:relative}.search-wrap input{width:100%;padding-right:42px}.search-icon{position:absolute;right:13px;top:8px;font-size:24px;color:#748196}
.workspace{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:12px}
.table-box{border:1px solid var(--line);border-radius:8px;overflow:hidden;min-height:410px}.table-head{display:grid;grid-template-columns:80px 1.7fr 120px 110px 120px 75px;background:#dfe9ff;border-bottom:1px solid #bdcce7;font-weight:800;color:#23385d}
.table-head div{padding:11px 8px;border-left:1px solid #c6d2e6;text-align:center}
.empty{min-height:340px;display:grid;place-items:center;text-align:center;color:#8795ad}.empty .cart{font-size:64px;opacity:.7}.empty strong{display:block;font-size:16px;margin-top:8px}.empty span{font-size:13px}
.side{border:1px solid var(--line);border-radius:8px;padding:12px;background:#fff}.total{background:#101827;color:#fff;border-radius:8px;padding:16px;text-align:center;margin-bottom:10px}.total small{display:block;font-size:13px;margin-bottom:5px}.total b{font-size:35px;color:#79f0a5}
.side-stat{border-radius:8px;padding:13px 14px;margin:9px 0;display:flex;justify-content:space-between;align-items:center;font-weight:700}.side-stat.green{background:#e1f7e9;color:#17863e}.side-stat.blue{background:#e4f1ff;color:#1169cf}.side-stat.purple{background:#eee6ff;color:#7140cf}.side-stat span{font-size:13px}.side-stat b{font-size:20px}
.action{width:100%;height:46px;border-radius:7px;margin-top:9px;font-size:15px;font-weight:800;border:1px solid}.save{background:#20a94d;color:#fff;border-color:#20a94d}.print{background:#fff;color:#23416c;border-color:#3e78ce}.clear{background:#fff;color:#e33d4c;border-color:#e33d4c}
.bottom-actions{display:flex;gap:10px;margin-top:12px}.bottom-actions button{height:45px;border:0;border-radius:7px;padding:0 30px;font-weight:800;font-size:14px}.add{background:#177be8;color:#fff}.edit{background:#f2a51a;color:#fff}.delete{background:#9aa9bd;color:#fff}
.footer{height:40px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:12px;color:#5c6a80}.dot{display:inline-block;width:9px;height:9px;background:#19b65b;border-radius:50%;margin-right:5px}
.product-list{width:100%}.product-row{display:grid;grid-template-columns:80px 1.7fr 120px 110px 120px 75px;border-bottom:1px solid #e5eaf2;align-items:center;text-align:center;min-height:58px;font-size:14px}.product-row>div{padding:9px 7px;border-left:1px solid #eef1f5}.product-row strong{display:block;text-align:right}.product-row small{display:block;text-align:right;color:#718096;font-size:11px;margin-top:3px}
@media(max-width:850px){.header{height:auto;padding:14px 16px}.brand{font-size:21px}.sub{font-size:11px}.clock,.header-btn{display:none}.content{padding:12px}.menu-grid{grid-template-columns:repeat(3,1fr);gap:9px}.card{min-height:83px;padding:12px 5px}.card .ico{font-size:25px}.card h3{font-size:14px}.search-row{grid-template-columns:1fr 1fr}.search-wrap{grid-column:1/-1}.workspace{grid-template-columns:1fr}.side{order:-1}.table-box{min-height:320px}.table-head{font-size:11px}.table-head div{padding:8px 4px}.bottom-actions{overflow:auto}.bottom-actions button{padding:0 18px;white-space:nowrap}.footer{padding:0 12px}}
</style>
</head>
<body>
<div class="app">
<header class="header"><div class="header-row">
<div class="brand-wrap"><div class="logo">W</div><div><div class="brand">WALID PHONE</div><div class="sub">إدارة المحل بكفاءة وسهولة</div></div></div>
<div class="header-tools"><div class="clock" id="clock"></div><button class="header-btn" onclick="openReports()">📅</button><button class="header-btn" onclick="openSettings()"><span>⚙️</span> الإعدادات</button></div>
</div></header>

<main class="content">
<div class="menu-grid">
<div class="card" onclick="showSales()"><div class="ico">🛒</div><h3>المبيعات</h3></div>
<div class="card" onclick="showStock()"><div class="ico">📦</div><h3>المخزون</h3></div>
<div class="card" onclick="showExpenses()"><div class="ico">💳</div><h3>المصاريف</h3></div>
<div class="card" onclick="showCustomers()"><div class="ico">👥</div><h3>الزبائن</h3></div>
<div class="card" onclick="privateAction('الحسابات والأرباح',openAccounts)"><div class="ico">📊</div><h3>الحسابات</h3></div>
<div class="card" onclick="openReports()"><div class="ico">📅</div><h3>التقارير</h3></div>
</div>

<div class="search-row">
<div class="search-wrap"><span class="search-icon">⌕</span><input id="search" type="search" placeholder="ابحث عن منتج بالاسم أو الكود ..." oninput="renderProducts()"></div>
<input id="codeSearch" placeholder="الباركود / الكود" oninput="renderProducts()">
<select id="categorySearch"><option value="">كل الأصناف</option></select>
<input id="dateFilter" type="date" onchange="renderSales()">
</div>

<div id="view"></div>
</main>
<footer class="footer"><span>👤 المستخدم : <b>admin</b></span><span>WALID PHONE | نظام تسيير المحل</span><span>البيانات محفوظة تلقائياً <i class="dot"></i></span></footer>
</div>

<div id="modal" class="modal hidden"><div class="modal-box"><div class="modal-title"><h2 id="modalTitle"></h2><button onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>

<style>
.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;z-index:20;padding:16px}.modal.hidden{display:none}.modal-box{background:#fff;border-radius:14px;width:min(560px,100%);max-height:90vh;overflow:auto;padding:18px}.modal-title{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e5e7eb;padding-bottom:10px;margin-bottom:14px}.modal-title h2{margin:0;font-size:20px}.modal-title button{border:0;background:#f1f5f9;border-radius:8px;padding:8px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form label{font-size:12px;color:#64748b}.form input,.form select{width:100%;height:42px;border:1px solid #d5dce7;border-radius:7px;padding:0 10px;margin-top:5px}.full{grid-column:1/-1}.form-actions{display:flex;gap:8px;margin-top:14px}.form-actions button{height:43px;border:0;border-radius:7px;padding:0 18px;font-weight:800}
.panel{border:1px solid #d7dee9;border-radius:8px;background:#fff;overflow:hidden}.panel-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#f7f9fc;border-bottom:1px solid #d7dee9}.panel-head h2{font-size:18px;margin:0}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 8px;border-bottom:1px solid #e8edf4;text-align:center;font-size:13px}.table th{background:#dfe9ff;color:#23385d}.mini-btn{border:0;border-radius:6px;padding:7px 10px;margin:2px;font-weight:700}.blue{background:#177be8;color:#fff}.red{background:#ef5360;color:#fff}.green{background:#20a94d;color:#fff}.orange{background:#f2a51a;color:#fff}.gray{background:#e7edf5;color:#334155}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}.kpi{border-radius:9px;padding:14px;text-align:center;background:#f3f7ff}.kpi b{display:block;font-size:22px}.kpi span{font-size:12px;color:#64748b}
.sale-layout{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:12px}.cart-empty{text-align:center;padding:70px 20px;color:#8492a8}.cart-empty .big{font-size:60px}.side-total{background:#101827;color:#fff;border-radius:8px;padding:16px;text-align:center}.side-total b{font-size:32px;color:#79f0a5}.side-actions button{width:100%;height:45px;margin-top:9px;border-radius:7px;border:1px solid;font-weight:800}
@media(max-width:850px){.sale-layout{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}.full{grid-column:auto}.table{min-width:720px}.panel{overflow:auto}.header-tools{display:none}}
</style>

<script>
const PRIVATE_CODE="2000";
const KEY="walid_phone_data_v1";
let db=JSON.parse(localStorage.getItem(KEY)||'{"products":[{"id":"1","code":"","name":"cable iPhone","category":"كابل","qty":10,"buy":0,"sell":0},{"id":"2","code":"","name":"cable TEPC","category":"كابل","qty":10,"buy":0,"sell":0},{"id":"3","code":"","name":"CABLE LUNA","category":"كابل","qty":10,"buy":0,"sell":0}],"sales":[],"expenses":[],"customers":[]}');
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function money(n){return Number(n||0).toLocaleString('fr-FR',{minimumFractionDigits:2})+" دج"}
function today(){return new Date().toISOString().slice(0,10)}
function privateAction(title,fn){let c=prompt("أدخل الكود السري:");if(c===PRIVATE_CODE)fn();else if(c!==null)alert("الكود غير صحيح.")}
function openModal(title,body){document.getElementById("modalTitle").textContent=title;document.getElementById("modalBody").innerHTML=body;document.getElementById("modal").classList.remove("hidden")}
function closeModal(){document.getElementById("modal").classList.add("hidden")}
function updateClock(){let d=new Date();document.getElementById("clock").innerHTML=d.toLocaleDateString("fr-CA")+"<br>"+d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}
setInterval(updateClock,1000);updateClock();

function categories(){return [...new Set(db.products.map(p=>p.category).filter(Boolean))]}
function renderCategoryOptions(){let s=document.getElementById("categorySearch"),v=s.value;s.innerHTML='<option value="">كل الأصناف</option>'+categories().map(x=>`<option>${x}</option>`).join("");s.value=v}

function renderSales(){showSales()}
function showSales(){document.getElementById("view").innerHTML=`
<div class="sale-layout"><section><div class="panel"><div class="panel-head"><h2>المبيعات</h2><button class="mini-btn blue" onclick="privateAction('إضافة منتج',addProduct)">＋ منتج جديد</button></div>
<div style="padding:12px"><select id="saleProduct" class="select" style="width:100%;height:44px"><option value="">اختر منتجًا للبيع</option>${db.products.map(p=>`<option value="${p.id}">${p.name} — ${p.code||"بدون كود"} — ${p.sell||0} دج — ستوك ${p.qty}</option>`).join("")}</select>
<div style="display:flex;gap:8px;margin-top:8px"><input id="saleQty" class="select" type="number" min="1" value="1" style="flex:1"><button class="mini-btn blue" onclick="addToCart()">إضافة للسلة</button></div></div>
<div id="cartBox"></div></div></section><aside><div class="panel" style="padding:12px"><div class="side-total"><div>المجموع الكلي</div><b id="cartTotal">0.00</b></div><div class="side-actions"><button class="green" onclick="completeSale()">▣ حفظ البيع</button><button class="gray" onclick="clearCart()">▥ مسح السلة</button><button class="blue" onclick="printLastSale()">▣ طباعة الفاتورة</button></div></div></aside></div>`;window.cart=[];renderCart()}
function addToCart(){let id=document.getElementById("saleProduct").value,q=+document.getElementById("saleQty").value||1,p=db.products.find(x=>x.id===id);if(!p)return alert("اختر منتجًا");if(q>p.qty)return alert("الكمية غير متوفرة");let x=cart.find(x=>x.id===id);if(x)x.qty+=q;else cart.push({id,qty:q});renderCart()}
function renderCart(){let box=document.getElementById("cartBox");if(!box)return;let total=cart.reduce((s,x)=>{let p=db.products.find(p=>p.id===x.id);return s+x.qty*(+p.sell||0)},0);document.getElementById("cartTotal").textContent=money(total).replace(" دج","");if(!cart.length){box.innerHTML='<div class="cart-empty"><div class="big">🛒</div>السلة فارغة</div>';return}box.innerHTML='<table class="table"><tr><th>المنتج</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th><th></th></tr>'+cart.map(x=>{let p=db.products.find(p=>p.id===x.id);return `<tr><td>${p.name}</td><td>${x.qty}</td><td>${money(p.sell)}</td><td>${money(x.qty*p.sell)}</td><td><button class="mini-btn red" onclick="removeCart('${x.id}')">حذف</button></td></tr>`}).join("")+'</table>'}
function removeCart(id){cart=cart.filter(x=>x.id!==id);renderCart()}
function clearCart(){cart=[];renderCart()}
function completeSale(){if(!cart.length)return alert("السلة فارغة");let total=0;cart.forEach(x=>{let p=db.products.find(p=>p.id===x.id);p.qty-=x.qty;total+=x.qty*(+p.sell||0)});db.sales.push({id:Date.now(),date:today(),time:new Date().toLocaleTimeString("fr-FR"),items:cart.map(x=>({...x})),total});save();alert("تم حفظ البيع بنجاح");cart=[];showSales()}
function printLastSale(){alert("تم تجهيز الفاتورة للطباعة. يمكن ربط الطباعة الفعلية في الخطوة التالية.")}

function showStock(){renderCategoryOptions();document.getElementById("view").innerHTML=`<div class="panel"><div class="panel-head"><h2>المخزون</h2><button class="mini-btn blue" onclick="privateAction('إضافة منتج',addProduct)">＋ إضافة منتج</button></div><table class="table"><tr><th>#</th><th>الكود</th><th>المنتج</th><th>الصنف</th><th>الكمية</th><th>شراء</th><th>بيع</th><th>إجراءات</th></tr><tbody id="productsBody"></tbody></table></div>`;renderProducts()}
function renderProducts(){let b=document.getElementById("productsBody");if(!b)return;let q=(document.getElementById("search")?.value||"").toLowerCase(),c=document.getElementById("codeSearch")?.value||"",cat=document.getElementById("categorySearch")?.value||"";let ps=db.products.filter(p=>(!q||p.name.toLowerCase().includes(q)||p.code.toLowerCase().includes(q))&&(!c||p.code.includes(c))&&(!cat||p.category===cat));b.innerHTML=ps.map((p,i)=>`<tr><td>${i+1}</td><td>${p.code||"—"}</td><td>${p.name}</td><td>${p.category||"—"}</td><td>${p.qty}</td><td>${money(p.buy)}</td><td>${money(p.sell)}</td><td><button class="mini-btn orange" onclick="privateAction('تعديل المنتج',()=>editProduct('${p.id}'))">تعديل</button><button class="mini-btn red" onclick="privateAction('حذف المنتج',()=>deleteProduct('${p.id}'))">حذف</button></td></tr>`).join("")||'<tr><td colspan="8">لا توجد نتائج</td></tr>'}
function addProduct(){openModal("إضافة منتج",`<div class="form"><label>كود المنتج<input id="fcode" placeholder="الكود الذي تحدده أنت"></label><label>اسم المنتج<input id="fname"></label><label>الصنف<input id="fcat" value="كابل"></label><label>الكمية<input id="fqty" type="number" min="0" value="0"></label><label>سعر الشراء<input id="fbuy" type="number" min="0" value="0"></label><label>سعر البيع<input id="fsell" type="number" min="0" value="0"></label></div><div class="form-actions"><button class="green" onclick="saveProduct()">حفظ</button><button class="gray" onclick="closeModal()">إلغاء</button></div>`)}
function saveProduct(){let code=fcode.value.trim(),name=fname.value.trim();if(!name)return alert("اكتب اسم المنتج");if(code&&db.products.some(p=>p.code===code))return alert("هذا الكود موجود مسبقًا");db.products.push({id:String(Date.now()),code,name,category:fcat.value,qty:+fqty.value||0,buy:+fbuy.value||0,sell:+fsell.value||0});save();closeModal();renderCategoryOptions();showStock()}
function editProduct(id){let p=db.products.find(x=>x.id===id);openModal("تعديل المنتج",`<div class="form"><label>كود المنتج<input id="fcode" value="${p.code}"></label><label>اسم المنتج<input id="fname" value="${p.name}"></label><label>الصنف<input id="fcat" value="${p.category}"></label><label>الكمية<input id="fqty" type="number" value="${p.qty}"></label><label>سعر الشراء<input id="fbuy" type="number" value="${p.buy}"></label><label>سعر البيع<input id="fsell" type="number" value="${p.sell}"></label></div><div class="form-actions"><button class="green" onclick="updateProduct('${id}')">حفظ</button></div>`)}
function updateProduct(id){let p=db.products.find(x=>x.id===id);Object.assign(p,{code:fcode.value.trim(),name:fname.value.trim(),category:fcat.value,qty:+fqty.value||0,buy:+fbuy.value||0,sell:+fsell.value||0});save();closeModal();showStock()}
function deleteProduct(id){if(confirm("حذف المنتج؟")){db.products=db.products.filter(p=>p.id!==id);save();showStock()}}

function showExpenses(){document.getElementById("view").innerHTML=`<div class="panel"><div class="panel-head"><h2>المصاريف</h2><button class="mini-btn blue" onclick="privateAction('إضافة مصروف',addExpense)">＋ مصروف جديد</button></div><table class="table"><tr><th>التاريخ</th><th>البيان</th><th>المبلغ</th><th>حذف</th></tr>${db.expenses.map(e=>`<tr><td>${e.date}</td><td>${e.note}</td><td>${money(e.amount)}</td><td><button class="mini-btn red" onclick="privateAction('حذف مصروف',()=>deleteExpense(${e.id}))">حذف</button></td></tr>`).join("")||'<tr><td colspan="4">لا توجد مصاريف</td></tr>'}</table></div>`}
function addExpense(){openModal("إضافة مصروف",`<div class="form"><label>البيان<input id="enote"></label><label>المبلغ<input id="eamount" type="number" min="0"></label></div><div class="form-actions"><button class="green" onclick="saveExpense()">حفظ</button></div>`)}
function saveExpense(){if(!enote.value||!eamount.value)return alert("أكمل البيانات");db.expenses.push({id:Date.now(),date:today(),note:enote.value,amount:+eamount.value});save();closeModal();showExpenses()}
function deleteExpense(id){db.expenses=db.expenses.filter(x=>x.id!==id);save();showExpenses()}

function showCustomers(){document.getElementById("view").innerHTML=`<div class="panel"><div class="panel-head"><h2>الزبائن والحسابات</h2><button class="mini-btn blue" onclick="privateAction('إضافة زبون',addCustomer)">＋ زبون جديد</button></div><table class="table"><tr><th>الاسم</th><th>الهاتف</th><th>الدين</th><th>حذف</th></tr>${db.customers.map(c=>`<tr><td>${c.name}</td><td>${c.phone||"—"}</td><td>${money(c.debt)}</td><td><button class="mini-btn red" onclick="privateAction('حذف زبون',()=>deleteCustomer(${c.id}))">حذف</button></td></tr>`).join("")||'<tr><td colspan="4">لا يوجد زبائن</td></tr>'}</table></div>`}
function addCustomer(){openModal("إضافة زبون",`<div class="form"><label>الاسم<input id="cname"></label><label>الهاتف<input id="cphone"></label><label>الدين<input id="cdebt" type="number" value="0"></label></div><div class="form-actions"><button class="green" onclick="saveCustomer()">حفظ</button></div>`)}
function saveCustomer(){if(!cname.value)return alert("اكتب الاسم");db.customers.push({id:Date.now(),name:cname.value,phone:cphone.value,debt:+cdebt.value||0});save();closeModal();showCustomers()}
function deleteCustomer(id){db.customers=db.customers.filter(x=>x.id!==id);save();showCustomers()}

function openAccounts(){let sales=db.sales.reduce((s,x)=>s+x.total,0),exp=db.expenses.reduce((s,x)=>s+x.amount,0);document.getElementById("view").innerHTML=`<div class="kpis"><div class="kpi"><b>${money(sales)}</b><span>إجمالي المبيعات</span></div><div class="kpi"><b>${money(exp)}</b><span>إجمالي المصاريف</span></div><div class="kpi"><b>${money(sales-exp)}</b><span>النتيجة</span></div><div class="kpi"><b>${db.sales.length}</b><span>عدد المبيعات</span></div></div><div class="panel"><div class="panel-head"><h2>الحسابات</h2></div><table class="table"><tr><th>التاريخ</th><th>الوقت</th><th>البيع</th></tr>${db.sales.map(s=>`<tr><td>${s.date}</td><td>${s.time}</td><td>${money(s.total)}</td></tr>`).join("")||'<tr><td colspan="3">لا توجد مبيعات</td></tr>'}</table></div>`}
function openReports(){privateAction("التقارير",()=>{let by={};db.sales.forEach(s=>by[s.date]=(by[s.date]||0)+s.total);document.getElementById("view").innerHTML=`<div class="panel"><div class="panel-head"><h2>التقارير اليومية</h2></div><table class="table"><tr><th>اليوم</th><th>المبيعات</th></tr>${Object.entries(by).sort().reverse().map(([d,v])=>`<tr><td>${d}</td><td>${money(v)}</td></tr>`).join("")||'<tr><td colspan="2">لا توجد بيانات</td></tr>'}</table></div>`})}
function openSettings(){privateAction("الإعدادات",()=>openModal("الإعدادات",`<p>بيانات التطبيق محفوظة محليًا على هذا الجهاز.</p><button class="mini-btn red" onclick="if(confirm('مسح كل البيانات؟')){localStorage.removeItem(KEY);location.reload()}">مسح كل البيانات</button>`))}
renderCategoryOptions();showSales();
</script>
</body>
